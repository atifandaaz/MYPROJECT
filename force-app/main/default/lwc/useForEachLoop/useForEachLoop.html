<template>
    <lightning-card title="How o use for Each lopp in LWC" icon-name="utility">
    <table border="2px">
    <tr>
        <th style="padding: 10px;" bgcolor="yellow">
            Student Name
        </th >
            <th style="padding: 10px;" bgcolor="yellow">
            Class
        </th>
            <th style="padding: 10px;" bgcolor="yellow">
            Fee
        </th>
    </tr>
        <template for:each={students} for:item="stu">
            <tr key={stu.id}>
                <td style="padding: 6px;" bgcolor="orange">{stu.name}</td>
                <td style="padding: 6px;" bgcolor="orange">{stu.class}</td>
                <td style="padding: 6px;" bgcolor="orange">{stu.fee}</td>
            </tr>

            
        </template>

       </table>

    </lightning-card>
</template>
